<svg xmlns="http://www.w3.org/2000/svg" height="12" width="12" viewBox="0 0 16 16">
<!-- MOLTENTERM-PATCH (#6): original Moltenterm "connecting" animation, replacing a third-party icon whose licence does not allow redistribution. -->
<title>connecting</title>
<style>
.moltenterm-connecting-dot{opacity:.35;animation:moltenterm-connecting-pulse 0.9s ease-in-out infinite}
.moltenterm-connecting-dot:nth-of-type(2){animation-delay:.15s}
.moltenterm-connecting-dot:nth-of-type(3){animation-delay:.3s}
@keyframes moltenterm-connecting-pulse{0%,70%,100%{opacity:.35}35%{opacity:1}}
</style>
<circle class="moltenterm-connecting-dot" cx="3" cy="8" r="1.8"/>
<circle class="moltenterm-connecting-dot" cx="8" cy="8" r="1.8"/>
<circle class="moltenterm-connecting-dot" cx="13" cy="8" r="1.8"/>
</svg>
