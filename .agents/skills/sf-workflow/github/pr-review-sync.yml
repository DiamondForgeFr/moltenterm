name: Sync PR review status

on:
  pull_request_target:
    # A pull request opened ready for review never emits ready_for_review (#876);
    # a merge into the PR target moves the ticket to Done (#845).
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: pr-review-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' && github.event.pull_request.merged == true || github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_sha is the trusted commit that supplied this default-branch
      # workflow. github.sha would instead point at the PR base (master for an
      # RC) and could load a stale lifecycle CLI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Sync the linked ticket through the guarded workflow
        env:
          GH_TOKEN: ${{ secrets.SF_PROJECTS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure SF_PROJECTS_TOKEN with access to this repository and write access to its GitHub Project."
            exit 1
          fi
          bash .claude/skills/sf-workflow/workflow-cli.sh sync-pr-review "$PR_NUMBER"
