name: medium
label: "🟡 Medium Complexity"
description: "Standard feature with structured analysis and planning"

# Status workflow
skipStatuses: []  # All statuses

# Steps configuration
steps:
  analyze:
    enabled: true
    depth: "standard"
    agents: 3  # 2-4 parallel agents
    taskKind: exploration  # codebase, and docs if the library is unfamiliar
  plan:
    enabled: true
    depth: "detailed"  # File-by-file plan
    approval: true  # User must approve plan
  subtasks:
    enabled: true
    mandatory: true  # Always create subtasks
  execute:
    taskKind: multi-file-feature  # delivery once decomposed: each subtask states its file set, expected result and check
  examine:
    enabled: false  # No adversarial review
  tests:
    type: "recommended"
    mandatory: false  # Recommended but not forced

# Test requirements
testing:
  unit: true  # Unit tests for business logic
  e2e: true  # E2E for user workflows
  regression: true  # Non-regression
  coverage: null

# AI guidance for this complexity level
aiInstructions: |
  This is a medium-complexity feature. Use a structured approach:

  **Analyze Phase (STANDARD):**
  - Launch 2-4 parallel `exploration` delegations (SKILL.md → Delegation routing)
  - Codebase: Find existing patterns, files, utilities
  - Documentation: Research library documentation if unfamiliar
  - Document findings with file:line references
  - Identify dependencies

  **Plan Phase (DETAILED):**
  - ULTRA THINK before planning
  - Create file-by-file implementation strategy
  - Map acceptance criteria to changes
  - Determine logical order (dependencies first)
  - Post plan as ticket comment
  - REQUEST USER APPROVAL before proceeding

  **Execute Phase:**
  - Create subtasks for each major file change
  - A delegated subtask names its task kind, file set, expected result and check (SKILL.md → Delegation routing)
  - Delegated, the delivery is a `multi-file-feature` delegation once the subtasks are decomposed; planning stays in the session (SKILL.md → Delegated ticket delivery)
  - Use TodoCreate to track progress
  - Implement file-by-file following the plan
  - Mark todos complete immediately after each task
  - Read files BEFORE editing them
  - NO scope creep - stick to the plan
  - Commit at each subtask done

  **Validate Phase:**
  - Build + lint + typecheck + unit tests
  - Verify each acceptance criterion
  - Fix failures before proceeding
  - Generate test plan and post as comment

  **Examine Phase (SKIP):**
  - No adversarial review for medium complexity

  **Tests Phase (RECOMMENDED):**
  - Create unit tests for business logic
  - Create E2E tests for user workflows
  - Run tests until all green
  - Commit tests before marking PR ready for review

  **Save Mode:**
  - If enabled, save all outputs to .claude/output/workflow/{ticket-id}/
  - Helps with debugging and review
