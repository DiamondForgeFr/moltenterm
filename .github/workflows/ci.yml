# Builds and tests pull requests to develop and main, and pushes to them. A draft pull request runs the quick
# checks, the test selection and, when a manifest changed, the security scan; marking it ready runs the rest, and
# returning it to draft cancels that run. A pull request runs only what its change affects (Affected tests,
# scripts/moltenterm-affected.mjs, #2011); a push to develop or main, a run started by hand or by ci-nightly.yml, and the
# `ci:full` label run everything. See UPSTREAM.md, "Continuous integration".

name: CI

on:
    pull_request:
        branches: [develop, main]
        types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    push:
        branches: [develop, main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # The nightly run (a dispatch on develop) neither cancels a push's run nor is cancelled by one.
    group: ci-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22

jobs:
    select:
        # What the change affects: the jobs below run, skip or narrow their tests on its outputs alone, which is what lets
        # the Required gate accept their skips. It needs no install: the plan reads only the changed paths.
        name: Affected tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: read
        outputs:
            full: ${{ steps.plan.outputs.full }}
            reason: ${{ steps.plan.outputs.reason }}
            backend: ${{ steps.plan.outputs.backend }}
            gobuild: ${{ steps.plan.outputs.gobuild }}
            gobuildwhy: ${{ steps.plan.outputs.gobuildwhy }}
            perf: ${{ steps.plan.outputs.perf }}
            deps: ${{ steps.plan.outputs.deps }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # A pull request checks out its merge commit: the first parent is the base it is compared with.
                  fetch-depth: 2
                  persist-credentials: false
            - name: Plan
              id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT: ${{ github.event_name }}
                  REF: ${{ github.ref_name }}
                  PR: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              # The label is read now, not from the event: a re-run keeps its event, so it sees a label added since.
              run: |
                  args=(--plan --summary --outputs --base HEAD^1)
                  if [ "$EVENT" != pull_request ]; then
                      args+=(--full --full-reason "a $EVENT run on $REF")
                  elif ! labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name'); then
                      args+=(--full --full-reason "the pull request's labels cannot be read")
                  elif grep -qx 'ci:full' <<< "$labels"; then
                      args+=(--full --full-reason "the ci:full label")
                  fi
                  node scripts/moltenterm-affected.mjs "${args[@]}"

    security:
        name: Dependency security
        needs: select
        # Also on every full run, the nightly one included: a new advisory shows there without failing every pull request.
        if: needs.select.outputs.deps == 'true'
        uses: ./.github/workflows/security-scan.yml

    quick:
        name: Quick checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The patch-ledger check diffs against the last merged Wave release, deep in the history.
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Patch ledger
              run: node scripts/moltenterm-check-ledger.mjs
            # Same deep history: it tells Wave's files (Apache-2.0) from Moltenterm's own (AGPL-3.0-only) by the base.
            - name: Licence headers
              run: node scripts/moltenterm-check-license.mjs
            - name: Icon names
              run: node scripts/moltenterm-check-icons.mjs
            - name: Shell scripts
              run: node scripts/moltenterm-check-shell.mjs
            # The other jobs' Task install (.github/actions/setup-task), against a local server: drafts check it too.
            - name: Task install
              run: node --test scripts/moltenterm-setup-task.node-test.mjs
            # The lockfile check asks npm what it would rewrite, and the answer follows npm's version.
            - name: The project's npm
              run: npm install --global --ignore-scripts --no-audit --no-fund "$(node -p "require('./package.json').packageManager")"
            - name: Lockfile
              run: node scripts/moltenterm-check-lockfile.mjs

    frontend:
        # Type check, lint, the build and the other global checks always run complete; the unit tests are the selection.
        name: Frontend
        needs: select
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            # Tests run under Node, so they do not need native modules rebuilt for Electron. They still need Electron's
            # binary: some test files import `electron`, whose entry point throws when the binary is missing.
            WAVETERM_SKIP_APP_DEPS: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 2
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            # setup-node caches npm's downloads, not Electron's binary, which `npm ci` fetches again otherwise.
            - name: Electron download cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/electron
                  key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            # The shared character package is a private repository (package.json): git reads it over this URL.
            - name: Private package access
              env:
                  CHARACTER_REPO_TOKEN: ${{ secrets.DIAMONDFORGE_CHARACTER_TOKEN }}
              run: git config --global url."https://x-access-token:${CHARACTER_REPO_TOKEN}@github.com/DiamondForgeFr/character-studio.git".insteadOf "ssh://git@github.com/DiamondForgeFr/character-studio.git"
            # `npm ci` with these flags, tried up to three times: a download timeout is not a failure of the change.
            - run: scripts/moltenterm-npm-ci.sh --no-audit --no-fund
            # The command behind `task check:ts`, without its `npm install` step.
            - name: Type check
              run: npx tsc --noEmit
            - name: Lint
              run: npx eslint . --quiet
            - name: Validation discovery regression
              run: node --test scripts/moltenterm-worktree-discovery.node-test.mjs
            - name: Unit tests
              env:
                  FULL: ${{ needs.select.outputs.full }}
                  REASON: ${{ needs.select.outputs.reason }}
              run: |
                  args=(--run --summary --only vitest --base HEAD^1)
                  if [ "$FULL" = true ]; then args+=(--full --full-reason "$REASON"); fi
                  node scripts/moltenterm-affected.mjs "${args[@]}"
            - name: Runtime dependency integration
              run: node scripts/security/runtime-check.mjs
            - name: Build
              run: npm run build:prod
            # The licence of every npm package the bundles above ship (taken from the build's module graph) and of the
            # fonts and icons public/ carries must be known and on build/moltenterm/license-policy.json (#2126).
            - name: Third-party licences
              run: node scripts/moltenterm-notices.mjs --check --sources npm,assets

    backend:
        # Skipped when no Go file changed and no Go test reads a changed file. `task build:backend` runs when a file the
        # build compiles or embeds changed (not `_test.go`, not testdata).
        name: Backend
        needs: select
        if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.select.outputs.backend == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 2
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  # The cache below instead: setup-go's is keyed on go.sum alone, so once saved it is never refreshed.
                  cache: false
            - name: Restore the Go caches
              id: gocache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
                  restore-keys: |
                      go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
                      go-${{ runner.os }}-
            - name: Go toolchain matches go.mod
              run: node scripts/moltenterm-go-toolchain.mjs --check
            # A full run disables Go's test cache, so a cached pass cannot hide a flaky test there.
            - name: Unit tests
              env:
                  FULL: ${{ needs.select.outputs.full }}
                  REASON: ${{ needs.select.outputs.reason }}
              run: |
                  args=(--run --summary --only go --base HEAD^1)
                  if [ "$FULL" = true ]; then args+=(--full --full-reason "$REASON" -- -count=1); fi
                  node scripts/moltenterm-affected.mjs "${args[@]}"
            # The Go modules wavesrv, wsh and molten link (`go list -deps`, from the module cache the tests just filled):
            # their licences must be known and allowed (#2126).
            - name: Third-party licences
              run: node scripts/moltenterm-notices.mjs --check --sources go
            # Only the build needs Task and Zig: installed after the tests, a download outage cannot keep them from running.
            - uses: ./.github/actions/setup-task
              if: needs.select.outputs.gobuild == 'true'
            # wavesrv links SQLite through CGO; on Linux the Taskfile compiles it with `zig cc`.
            - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              if: needs.select.outputs.gobuild == 'true'
              with:
                  version: 0.16.0
            - name: Build
              if: needs.select.outputs.gobuild == 'true'
              run: task build:backend
            - name: Build skipped
              if: needs.select.outputs.gobuild != 'true'
              env:
                  WHY: ${{ needs.select.outputs.gobuildwhy }}
              run: |
                  echo "\`task build:backend\` skipped: $WHY." >> "$GITHUB_STEP_SUMMARY"
            # One entry a day (the nightly run), plus a push that found none: an entry per push would evict the others.
            - name: Save the Go caches
              if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.gocache.outputs.cache-matched-key == '')
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

    perf:
        # The machine-independent subset of the performance harness (scripts/perf/README.md, FR-PERF-006): bundle size,
        # JS evaluated by a tab view, a start-up smoke test and leaked tab views, against scripts/perf/budgets.json and
        # the stored baseline. Times are reported, not gated: CI runners are too noisy for them. Skipped when the change
        # touches nothing the budgets measure: Affected tests' summary says why.
        name: Perf budgets
        needs: select
        if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.select.outputs.perf == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Electron download cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/electron
                  key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: false
            # Backend's caches, read only: the same `task build:backend` warms them.
            - name: Restore the Go caches
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
                  restore-keys: |
                      go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
                      go-${{ runner.os }}-
            - uses: ./.github/actions/setup-task
            - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              with:
                  version: 0.16.0
            - name: Private package access
              env:
                  CHARACTER_REPO_TOKEN: ${{ secrets.DIAMONDFORGE_CHARACTER_TOKEN }}
              run: git config --global url."https://x-access-token:${CHARACTER_REPO_TOKEN}@github.com/DiamondForgeFr/character-studio.git".insteadOf "ssh://git@github.com/DiamondForgeFr/character-studio.git"
            # The app runs here, so Electron's native dependencies are installed (no WAVETERM_SKIP_APP_DEPS).
            - run: scripts/moltenterm-npm-ci.sh --no-audit --no-fund
            - name: Build the app
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: |
                  task build:backend
                  npm run build:prod
            - name: Run the CI perf profile
              id: perf
              run: |
                  if xvfb-run -a --server-args="-screen 0 1600x1000x24" node scripts/perf/perf.mjs run --profile ci --gate ci --out perf-report; then
                      echo "failed=0" >> "$GITHUB_OUTPUT"
                  else
                      echo "failed=1" >> "$GITHUB_OUTPUT"
                  fi
                  if [ -f perf-report/report.md ]; then cat perf-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
            - name: Post the report on the pull request
              if: always() && github.event_name == 'pull_request'
              # A pull request from a fork gets a read-only token: the report stays in the job summary.
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  [ -f perf-report/report.md ] || exit 0
                  marker="<!-- moltenterm-perf-report -->"
                  { echo "$marker"; head -c 60000 perf-report/report.md; } > perf-comment.md
                  id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -1)
                  if [ -n "$id" ]; then
                      gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@perf-comment.md > /dev/null
                  else
                      gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@perf-comment.md > /dev/null
                  fi
            - name: Budget verdict
              if: steps.perf.outputs.failed != '0'
              run: |
                  echo "::error::A performance budget was exceeded or a perf scenario failed; see the report in the job summary"
                  exit 1

    gate:
        # No `needs`: a job that waits on others gets its check only when they finish, so after a pull request is
        # marked ready the "Required gate" success of its draft's run on the same commit would satisfy a ruleset until
        # then. Starting with the run keeps the check pending from the first second, and a cancelled run leaves a check
        # that the next run on the same commit replaces.
        #
        # Each job maps to the conclusions it may end with. Backend, Perf budgets and Dependency security skip only on
        # Affected tests' outputs (or a draft), so with Affected tests green their skip is the selection's; a job skipped
        # because Affected tests failed fails through Affected tests' own entry. A called workflow's jobs are named
        # "<caller> / <job>" while it runs and "<caller>" when it is skipped: the gate compares the part before " / ".
        name: Required gate
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            actions: read
        steps:
            - name: Wait for the other jobs and check their results
              env:
                  GH_TOKEN: ${{ github.token }}
                  JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
                  DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
              run: |
                  heavy='["success"]'
                  selected='["success", "skipped"]'
                  if [ "$DRAFT" = "true" ]; then heavy='["skipped"]'; selected='["skipped"]'; fi
                  want="{\"Affected tests\": [\"success\"], \"Quick checks\": [\"success\"], \"Dependency security\": [\"success\", \"skipped\"], \"Frontend\": $heavy, \"Backend\": $selected, \"Perf budgets\": $selected}"
                  verdict="wait"
                  while [ "$verdict" = "wait" ]; do
                      sleep 10
                      jobs=$(gh api "$JOBS" --jq '[.jobs[] | {name, status, conclusion}]') || continue
                      verdict=$(echo "$jobs" | jq -r --argjson want "$want" '
                          [.[] | . + {key: (.name | sub(" / .*$"; ""))} | select($want[.key] != null)] as $ours
                          | if any($ours[]; .status == "completed" and (.conclusion as $c | $want[.key] | index($c) | not)) then "fail"
                            elif ([$ours[].key] | unique | length) == ($want | length) and all($ours[]; .status == "completed") then "pass"
                            else "wait" end')
                  done
                  echo "$jobs" | jq -r '.[] | select(.name != "Required gate") | "\(.name): \(.conclusion // .status)"'
                  echo "Expected: $want"
                  if [ "$verdict" = fail ]; then
                      echo "::error::The validation did not complete"
                      exit 1
                  fi

    report:
        # A failed full run on develop or main (a push, or the nightly dispatch) opens an issue, or adds to the one still
        # open. It never blocks a pull request: it is how a gap in the selection, or a flaky test, surfaces within a day.
        name: Report a failed full run
        needs: [select, quick, security, frontend, backend, perf]
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && contains(needs.*.result, 'failure')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Open or update the issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  BRANCH: ${{ github.ref_name }}
                  EVENT: ${{ github.event_name }}
                  SHA: ${{ github.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  title="CI: the full suites fail on $BRANCH"
                  failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
                  {
                      echo "The full CI run (\`$EVENT\`) failed on \`$BRANCH\` at $SHA. Failed jobs: $failed."
                      echo
                      echo "Run: $RUN_URL"
                      echo
                      echo "Pull requests run only the tests their change affects (\`scripts/moltenterm-affected.mjs\`), so this"
                      echo "can be a test the selection missed, a flaky test, or a change merged on a selected run. It blocks no"
                      echo "pull request. Close this issue once the full suites are green again."
                  } > body.md
                  number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
                  if [ -n "$number" ]; then
                      gh issue comment "$number" --body-file body.md
                  else
                      gh issue create --title "$title" --body-file body.md
                  fi
