# Builds and tests pull requests to develop and main, and pushes to them. A draft pull request runs only the quick
# checks; marking it ready for review runs everything, and returning it to draft cancels that run. See UPSTREAM.md,
# "Continuous integration".

name: CI

on:
    pull_request:
        branches: [develop, main]
        types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    push:
        branches: [develop, main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22

jobs:
    quick:
        name: Quick checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The patch-ledger check diffs against the last merged Wave release, deep in the history.
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Patch ledger
              run: node scripts/moltenterm-check-ledger.mjs
            - name: Icon names
              run: node scripts/moltenterm-check-icons.mjs

    frontend:
        name: Frontend
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            # Type checks, tests and bundling need neither the native-module rebuild for Electron nor its binary.
            WAVETERM_SKIP_APP_DEPS: "1"
            ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci --no-audit --no-fund
            # The command behind `task check:ts`, without its `npm install` step.
            - name: Type check
              run: npx tsc --noEmit
            - name: Lint
              run: npx eslint . --quiet
            - name: Unit tests
              run: npx vitest run
            - name: Build
              run: npm run build:prod

    backend:
        name: Backend
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum
            - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            # wavesrv links SQLite through CGO; on Linux the Taskfile compiles it with `zig cc`.
            - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              with:
                  version: 0.16.0
            - name: Unit tests
              run: go test ./cmd/... ./pkg/...
            - name: Build
              run: task build:backend

    gate:
        name: Required gate
        needs: [quick, frontend, backend]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check that every expected job passed
              env:
                  DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
                  QUICK: ${{ needs.quick.result }}
                  FRONTEND: ${{ needs.frontend.result }}
                  BACKEND: ${{ needs.backend.result }}
              run: |
                  heavy=success
                  if [ "$DRAFT" = "true" ]; then heavy=skipped; fi
                  echo "quick=$QUICK frontend=$FRONTEND backend=$BACKEND (frontend and backend expected: $heavy)"
                  if [ "$QUICK" != success ] || [ "$FRONTEND" != "$heavy" ] || [ "$BACKEND" != "$heavy" ]; then
                      echo "::error::The validation did not complete"
                      exit 1
                  fi
