# Builds and tests pull requests to develop and main, and pushes to them. A draft pull request runs only the quick
# checks; marking it ready for review runs everything, and returning it to draft cancels that run. See UPSTREAM.md,
# "Continuous integration".

name: CI

on:
    pull_request:
        branches: [develop, main]
        types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    push:
        branches: [develop, main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22

jobs:
    quick:
        name: Quick checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The patch-ledger check diffs against the last merged Wave release, deep in the history.
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Patch ledger
              run: node scripts/moltenterm-check-ledger.mjs
            - name: Icon names
              run: node scripts/moltenterm-check-icons.mjs

    frontend:
        name: Frontend
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            # Tests run under Node, so they do not need native modules rebuilt for Electron. They still need Electron's
            # binary: some test files import `electron`, whose entry point throws when the binary is missing.
            WAVETERM_SKIP_APP_DEPS: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci --no-audit --no-fund
            # The command behind `task check:ts`, without its `npm install` step.
            - name: Type check
              run: npx tsc --noEmit
            - name: Lint
              run: npx eslint . --quiet
            - name: Unit tests
              run: npx vitest run
            - name: Build
              run: npm run build:prod

    backend:
        name: Backend
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum
            - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            # wavesrv links SQLite through CGO; on Linux the Taskfile compiles it with `zig cc`.
            - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              with:
                  version: 0.16.0
            - name: Go toolchain matches go.mod
              run: node scripts/moltenterm-go-toolchain.mjs --check
            - name: Unit tests
              run: go test ./cmd/... ./pkg/...
            - name: Build
              run: task build:backend

    gate:
        # No `needs`: a job that waits on others gets its check only when they finish, so after a pull request is
        # marked ready the "Required gate" success of its draft's run on the same commit would satisfy a ruleset until
        # then. Starting with the run keeps the check pending from the first second, and a cancelled run leaves a check
        # that the next run on the same commit replaces.
        name: Required gate
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            actions: read
        steps:
            - name: Wait for the other jobs and check their results
              env:
                  GH_TOKEN: ${{ github.token }}
                  JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
                  DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
              run: |
                  heavy=success
                  if [ "$DRAFT" = "true" ]; then heavy=skipped; fi
                  want="{\"Quick checks\": \"success\", \"Frontend\": \"$heavy\", \"Backend\": \"$heavy\"}"
                  verdict="wait"
                  while [ "$verdict" = "wait" ]; do
                      sleep 10
                      jobs=$(gh api "$JOBS" --jq '[.jobs[] | {name, status, conclusion}]') || continue
                      verdict=$(echo "$jobs" | jq -r --argjson want "$want" '
                          [.[] | select($want[.name] != null)] as $ours
                          | if any($ours[]; .status == "completed" and .conclusion != $want[.name]) then "fail"
                            elif ($ours | length) == ($want | length) and all($ours[]; .status == "completed") then "pass"
                            else "wait" end')
                  done
                  echo "$jobs" | jq -r '.[] | select(.name != "Required gate") | "\(.name): \(.conclusion // .status)"'
                  echo "Frontend and Backend expected: $heavy"
                  if [ "$verdict" = fail ]; then
                      echo "::error::The validation did not complete"
                      exit 1
                  fi
