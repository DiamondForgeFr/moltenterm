# Builds a release tag and publishes its GitHub release (FR-REL-002, DS-REL-002). The tag is pushed by
# `molten release finalize` (the cut step of .molten/project.json); see UPSTREAM.md, "Releases".
#
#   vX.Y.Z-N  a release candidate: published as a prerelease at once, never the latest release
#   vX.Y.Z    a public release: left as a draft the developer publishes on GitHub
#
# A rehearsal (#508) builds the same files from any branch without a tag, and publishes nothing: started by hand or by
# `molten release rehearse` (the rehearse step of .molten/project.json), it keeps the files as the run's artifacts
# for 14 days, to install and check before cutting a release candidate. A pull request that changes this workflow
# runs its first job only, which also makes GitHub know the workflow, so that it can be dispatched before it is on
# main.
#
# macOS builds are ad-hoc signed and not notarized until a Developer ID exists; the release text says how to open
# them. The channel feeds read by the app are #188's: the electron-builder update files (latest*.yml) are published
# with the binaries for it.
#
# SHA256SUMS.txt is signed with the DiamondForge release key once it exists (#576, scripts/moltenterm-release-sign.sh):
# until then the release is published unsigned and the log says so; afterwards a signature that fails fails the run.

name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            channel:
                description: "The channel the rehearsal is built for"
                type: choice
                options: [rc, public]
                default: rc
    pull_request:
        paths:
            - .github/workflows/release.yml
            - scripts/moltenterm-release-files.sh
            - scripts/moltenterm-release-sign.sh
            - scripts/moltenterm-release-sign-test.sh

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    NODE_VERSION: 22
    # The renderer bundle needs more than Node's default heap on the macOS runners, as in ci.yml (found by the first
    # rehearsal, #508).
    NODE_OPTIONS: --max-old-space-size=4096

jobs:
    meta:
        name: Release tag
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            mode: ${{ steps.tag.outputs.mode }}
            channel: ${{ steps.tag.outputs.channel }}
            version: ${{ steps.tag.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            # A tag nobody can classify is never published under a default, and a release is only built from main. A
            # rehearsal builds the commit as it is, with package.json's version, and is never published.
            - name: Read the tag
              id: tag
              env:
                  TAG: ${{ github.ref_name }}
                  EVENT: ${{ github.event_name }}
                  INPUT_CHANNEL: ${{ inputs.channel }}
              run: |
                  if [ "$EVENT" != push ]; then
                      mode=check
                      channel=rc
                      if [ "$EVENT" = workflow_dispatch ]; then
                          mode=rehearsal
                          channel="${INPUT_CHANNEL:-rc}"
                      fi
                      if [ "$channel" != rc ] && [ "$channel" != public ]; then
                          echo "::error::$channel is not a release channel (rc or public)"
                          exit 1
                      fi
                      version="$(node -p 'require("./package.json").version')"
                      {
                          echo "mode=$mode"
                          echo "channel=$channel"
                          echo "version=$version"
                      } >> "$GITHUB_OUTPUT"
                      echo "$mode of $TAG at ${GITHUB_SHA:0:7}: $channel build of $version, nothing is published"
                      exit 0
                  fi
                  if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([1-9][0-9]*))?$ ]]; then
                      echo "::error::$TAG is not a release tag (vX.Y.Z or vX.Y.Z-N)"
                      exit 1
                  fi
                  version="${TAG#v}"
                  if [[ "$version" == *-* ]]; then
                      channel=rc
                  else
                      channel=public
                  fi
                  package_version="$(node -p 'require("./package.json").version')"
                  if [ "$package_version" != "$version" ]; then
                      echo "::error::package.json reads $package_version at $TAG, not $version: cut releases with molten release"
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "::error::$TAG is not on main: releases are cut from main"
                      exit 1
                  fi
                  if [ ! -s "releases/$TAG.md" ]; then
                      echo "::warning::releases/$TAG.md is missing: the release text will say so"
                  elif node scripts/moltenterm-release-notes-body.mjs --draft "releases/$TAG.md"; then
                      echo "::error::releases/$TAG.md is marked draft: true: its notes were never finished (molten release finalize refuses them)"
                      exit 1
                  fi
                  if [ "$channel" = public ]; then
                      echo "::warning::The macOS builds are not signed with a Developer ID nor notarized: sign them before publishing a public release"
                  fi
                  echo "mode=release" >> "$GITHUB_OUTPUT"
                  echo "channel=$channel" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "$TAG: $channel release $version"
            # The signing logic, with a throwaway key the test generates and deletes: never the release key (#576).
            - name: Test the release signing
              if: github.event_name == 'pull_request'
              run: scripts/moltenterm-release-sign-test.sh

    macos:
        name: macOS (arm64, x64)
        needs: meta
        if: needs.meta.outputs.mode != 'check'
        # Both architectures on one runner: electron-builder writes one latest-mac.yml listing both.
        runs-on: macos-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The build stamps the last release reachable from the commit (frontend/moltenterm-shell/build).
                  fetch-depth: 0
                  persist-credentials: false
            # No dependency cache: a release is built only from what its lockfiles name, never from a cache another
            # branch's run could have written.
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: false
            - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - run: npm ci --no-audit --no-fund
            # Ad hoc (`-`): an unsigned arm64 app does not start at all, an ad-hoc one opens once Gatekeeper is told to.
            # The github publish provider only makes electron-builder write latest-mac.yml: `-p never` uploads nothing.
            - name: Package
              env:
                  MOLTENTERM_BUILD_CHANNEL: ${{ needs.meta.outputs.channel }}
                  MOLTENTERM_BUILD_ID: ${{ github.run_id }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  OWNER: ${{ github.repository_owner }}
                  REPO: ${{ github.event.repository.name }}
              run: >-
                  task package -- --mac zip dmg --arm64 --x64 -c.mac.identity=-
                  -c.publish.provider=github "-c.publish.owner=$OWNER" "-c.publish.repo=$REPO"
            - name: Check the signatures
              run: |
                  for app in make/mac*/*.app; do
                      codesign --verify --deep --strict "$app"
                      echo "$app: valid ad-hoc signature"
                  done
            # A rehearsal's artifacts are named so that they are never taken for a release's, and kept long enough to
            # be installed and checked.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ needs.meta.outputs.mode == 'rehearsal' && format('{0}-rehearsal-macos-{1}', github.event.repository.name, github.sha) || 'release-macos' }}
                  path: |
                      make/*.dmg
                      make/*.zip
                      make/*.blockmap
                      make/latest-mac.yml
                  if-no-files-found: error
                  retention-days: ${{ needs.meta.outputs.mode == 'rehearsal' && 14 || 1 }}

    linux:
        name: Linux (${{ matrix.arch }})
        needs: meta
        if: needs.meta.outputs.mode != 'check'
        # wavesrv's CGO build targets the runner's own architecture (Taskfile.yml, build:server:linux).
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      arch: x64
                    - runner: ubuntu-24.04-arm
                      arch: arm64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            # No dependency cache: a release is built only from what its lockfiles name, never from a cache another
            # branch's run could have written.
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: false
            - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              with:
                  version: 0.16.0
            # electron-builder's bundled fpm has no arm64 build: the deb is made with the system's (USE_SYSTEM_FPM).
            - name: Packaging tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools ruby ruby-dev build-essential
                  sudo gem install --no-document fpm -v 1.18.0
            - run: npm ci --no-audit --no-fund
            - name: Package
              env:
                  MOLTENTERM_BUILD_CHANNEL: ${{ needs.meta.outputs.channel }}
                  MOLTENTERM_BUILD_ID: ${{ github.run_id }}
                  USE_SYSTEM_FPM: "true"
                  ARCH: ${{ matrix.arch }}
                  OWNER: ${{ github.repository_owner }}
                  REPO: ${{ github.event.repository.name }}
              run: >-
                  task package -- --linux AppImage deb "--$ARCH"
                  -c.publish.provider=github "-c.publish.owner=$OWNER" "-c.publish.repo=$REPO"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ needs.meta.outputs.mode == 'rehearsal' && format('{0}-rehearsal-linux-{1}-{2}', github.event.repository.name, matrix.arch, github.sha) || format('release-linux-{0}', matrix.arch) }}
                  path: |
                      make/*.AppImage
                      make/*.deb
                      make/latest-linux*.yml
                  if-no-files-found: error
                  retention-days: ${{ needs.meta.outputs.mode == 'rehearsal' && 14 || 1 }}

    rehearsal:
        name: Rehearsal files
        needs: [meta, macos, linux]
        if: needs.meta.outputs.mode == 'rehearsal'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: ${{ github.event.repository.name }}-rehearsal-*
                  path: dist-rehearsal
                  merge-multiple: true
            - name: Check the files and write the checksums
              run: scripts/moltenterm-release-files.sh dist-rehearsal
            # As on a release, so that the checklist covers the signature before a candidate is cut.
            - name: Sign the checksums
              id: sign
              env:
                  RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
                  RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
              run: scripts/moltenterm-release-sign.sh dist-rehearsal
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ github.event.repository.name }}-rehearsal-checksums-${{ github.sha }}
                  path: |
                      dist-rehearsal/SHA256SUMS.txt
                      dist-rehearsal/*.asc
                  if-no-files-found: error
                  retention-days: 14
            - name: Summary
              env:
                  CHANNEL: ${{ needs.meta.outputs.channel }}
                  VERSION: ${{ needs.meta.outputs.version }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  SIGNED: ${{ steps.sign.outputs.signed }}
                  FINGERPRINT: ${{ steps.sign.outputs.fingerprint }}
              run: |
                  {
                      echo "## Rehearsal of $VERSION ($CHANNEL), ${GITHUB_SHA:0:7} on $GITHUB_REF_NAME"
                      echo
                      echo "No tag, no release: the files are this run's artifacts for 14 days, at $RUN_URL."
                      echo "Install them and walk the checklist of RELEASE.md before cutting a release candidate."
                      echo
                      if [ "$SIGNED" = true ]; then
                          echo "Signed with the release key $FINGERPRINT: \`SHA256SUMS.txt.asc\` and a \`.asc\` per AppImage and deb."
                      else
                          echo "Not signed: no release key yet (RELEASE.md, \"The release key\")."
                      fi
                      echo
                      echo '```'
                      cat dist-rehearsal/SHA256SUMS.txt
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    publish:
        name: GitHub release
        needs: [meta, macos, linux]
        if: needs.meta.outputs.mode == 'release'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: release-*
                  path: dist-release
                  merge-multiple: true
            - name: Check the files and write the checksums
              run: scripts/moltenterm-release-files.sh dist-release
            # Closed failure once the key exists: a wrong secret fails the run here, before anything is published.
            - name: Sign the checksums
              id: sign
              env:
                  RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
                  RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
              run: scripts/moltenterm-release-sign.sh dist-release
            - name: Write the release text
              env:
                  TAG: ${{ github.ref_name }}
                  SIGNED: ${{ steps.sign.outputs.signed }}
                  FINGERPRINT: ${{ steps.sign.outputs.fingerprint }}
                  KEY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/release-signing-key.asc
              run: |
                  {
                      if [ -s "releases/$TAG.md" ]; then
                          # The public notes without their front matter (UPSTREAM.md, "Release notes").
                          node scripts/moltenterm-release-notes-body.mjs "releases/$TAG.md"
                      else
                          echo "The notes of $TAG are missing."
                      fi
                      cat <<'EOF'

                  ## Install

                  - **macOS**: open the `.dmg` (`darwin-arm64` for Apple Silicon, `darwin-x64` for Intel) and drag MoltenTerm to Applications. This build is not signed with an Apple Developer ID yet, so macOS refuses to open it the first time: right-click MoltenTerm in Applications and choose **Open**, or run `xattr -dr com.apple.quarantine /Applications/MoltenTerm.app`.
                  - **Linux**: make the `.AppImage` executable (`chmod +x`) and run it, or install the `.deb` with `sudo apt install ./<file>.deb`. `arm64` is for ARM machines, the other files for Intel and AMD.
                  - **Checksums**: `SHA256SUMS.txt` lists the SHA-256 of every file (`sha256sum --ignore-missing -c SHA256SUMS.txt`).

                  ## Verify

                  EOF
                      if [ "$SIGNED" = true ]; then
                          echo "\`SHA256SUMS.txt.asc\` is a GPG signature of \`SHA256SUMS.txt\` by the DiamondForge release key, so one check covers every file; each AppImage and deb also has its own \`.asc\`. The key's fingerprint is \`$FINGERPRINT\`: check that \`gpg --verify\` names it."
                      else
                          echo "This release is not signed yet: it has no \`SHA256SUMS.txt.asc\`, and the DiamondForge release key's fingerprint is not published yet. Once it is, the releases are verified this way:"
                      fi
                      cat <<EOF

                  \`\`\`
                  curl -fsSL $KEY_URL | gpg --import
                  gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
                  sha256sum --ignore-missing -c SHA256SUMS.txt   # shasum -a 256 --ignore-missing -c on macOS
                  \`\`\`
                  EOF
                  } > release-body.md
            - name: Create or update the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
                  CHANNEL: ${{ needs.meta.outputs.channel }}
              run: |
                  files=(dist-release/*)
                  if gh release view "$TAG" > /dev/null 2>&1; then
                      if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
                          # A re-run on a draft: the files are replaced, the text rewritten; `--tag` is sent again so
                          # that editing a draft never detaches it from its tag.
                          gh release upload "$TAG" "${files[@]}" --clobber
                          gh release edit "$TAG" --tag "$TAG" --title "MoltenTerm $TAG" --notes-file release-body.md
                      else
                          # A published release keeps the files people downloaded: a re-run only adds missing ones.
                          present="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
                          for file in "${files[@]}"; do
                              if ! grep -qxF "$(basename "$file")" <<< "$present"; then
                                  gh release upload "$TAG" "$file"
                              fi
                          done
                      fi
                  elif [ "$CHANNEL" = rc ]; then
                      gh release create "$TAG" "${files[@]}" --verify-tag --title "MoltenTerm $TAG" --notes-file release-body.md --prerelease --latest=false
                  else
                      gh release create "$TAG" "${files[@]}" --verify-tag --title "MoltenTerm $TAG" --notes-file release-body.md --draft
                  fi
                  gh release view "$TAG" --json url,isDraft,isPrerelease --jq '"\(.url) draft=\(.isDraft) prerelease=\(.isPrerelease)"'
